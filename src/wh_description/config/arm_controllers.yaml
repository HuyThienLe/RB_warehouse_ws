controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: position_controllers/JointGroupPositionController

arm_controller:
  ros__parameters:
    joints:
      - lift_joint
      - shoulder_joint
      - elbow_joint
      - wrist_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 5.0
      lift_joint:
        trajectory: 0.0
        goal: 0.02
      shoulder_joint:
        trajectory: 0.0
        goal: 0.05
      elbow_joint:
        trajectory: 0.0
        goal: 0.05
      wrist_joint:
        trajectory: 0.0
        goal: 0.05

gripper_controller:
  ros__parameters:
    joints:
      - left_finger_joint
      - right_finger_joint
