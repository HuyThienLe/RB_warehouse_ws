# servo_params.yaml – Tham số điều khiển Visual Servoing (PBVS) cho Mecanum
dock_server:
  ros__parameters:
    target_standoff: 0.435         # m (khoảng cách cách mặt tag ô kệ khi đỗ chuẩn = 1 cánh tay duỗi thẳng SCARA)
    tol_dist: 0.04                 # 4 cm (tay máy có dung sai tiếp xúc 8 cm)
    tol_lat: 0.03                  # 3 cm
    tol_yaw: 0.08                  # ~4.5 deg ~ 0.08 rad
    v_max: 0.12                    # Giới hạn vận tốc tịnh tiến (m/s)
    w_max: 0.20                    # Giới hạn vận tốc góc (rad/s)
    safety_min_px: 0.28            # Khóa an toàn: cấm px < 0.28 m (dừng ngay tránh đâm kệ)
    kp_x: 0.9                      # Hệ số tỉ lệ tiến lùi
    kp_y: 0.9                      # Hệ số tỉ lệ dịch ngang
    kp_w: 1.2                      # Hệ số tỉ lệ xoay góc
    sign_x: 1.0                    # Dấu điều khiển vx (xác định qua calibrate_signs)
    sign_y: 1.0                    # Dấu điều khiển vy
    sign_w: 1.0                    # Dấu điều khiển wz
    consecutive_frames_stop: 3     # Số frame liên tiếp thỏa dung sai để kết luận hoàn tất
    timeout_sec: 35.0              # Timeout tổng của hành động dock
    tag_lost_timeout_sec: 2.0      # Thời gian mất tag trước khi kích hoạt hồi phục
    max_retries: 3                 # Số lần thử lại sau khi lùi về vị trí chờ
    cmd_topic: "/cmd_vel_servo"
