# collision_monitor_params.yaml – Lớp an toàn dừng khẩn cấp độc lập
# Giám sát vật cản từ /scan, điều khiển dòng lệnh từ /cmd_vel_muxed -> /cmd_vel

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_muxed"
    cmd_vel_out_topic: "/cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["StopZone", "SlowZone"]
    StopZone:
      type: "polygon"
      points: [0.28, 0.14, 0.28, -0.14, 0.23, -0.14, 0.23, 0.14]
      action_type: "stop"
      max_points: 4
      visualize: true
      polygon_pub_topic: "stop_zone"
      enabled: true
    SlowZone:
      type: "polygon"
      points: [0.38, 0.16, 0.38, -0.16, 0.23, -0.16, 0.23, 0.16]
      action_type: "slowdown"
      max_points: 4
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: "slow_zone"
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
