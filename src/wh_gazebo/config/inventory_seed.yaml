    slot_id: 0    # rack_a, col 0, tier 1

  - box_id: 21
    slot_id: 1    # rack_a, col 1, tier 1

  - box_id: 22
    slot_id: 3    # rack_a, col 0, tier 2

  - box_id: 23
    slot_id: 6    # rack_b, col 0, tier 1

  - box_id: 24
    slot_id: 8    # rack_b, col 2, tier 1

  - box_id: 25
