# inventory_seed.yaml – Hộp đặt sẵn khi khởi động simulation
# box_id: id của hộp (dùng ArUco tag 20-39)
# slot_id: id tag ô kệ (0-11), hoặc đặt pose tuyệt đối

boxes:
  # 6 hộp trong kệ (ô 0, 1, 3, 6, 8, 10)
